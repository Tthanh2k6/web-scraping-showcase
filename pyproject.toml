[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraping-showcase"
version = "0.1.0"
description = "Production-style web scraping & hidden API extraction showcase (async httpx, Playwright, SQLite/CSV/JSON export)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tran Trung Thanh" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
scrape-books = "showcase.books:main"
compare-scroll = "showcase.quotes_compare:main"
sniff-api = "showcase.sniffer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
